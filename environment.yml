# Local (WSL2/conda) environment for FEM baseline + PINN code authoring/smoke-testing.
#
# NOTE: This machine already has a working DOLFINx install in the `fenicsx-env`
# conda environment. Rather than duplicating the (large) DOLFINx/PETSc/mpich
# stack in a new env, this file documents the packages `fenicsx-env` should
# have and can be applied with:
#
#   conda env update -n fenicsx-env -f environment.yml --prune
#
# If you are setting up on a fresh machine with no existing DOLFINx install,
# create it fresh instead:
#
#   conda env create -f environment.yml
#
# IMPORTANT: DOLFINx must come from conda-forge, not pip.
# IMPORTANT: Legacy FEniCS (the old `dolfin` package) tutorials/APIs are NOT
# compatible with DOLFINx (`dolfinx`) — they are different projects with a
# similar name. Only follow DOLFINx-specific documentation and demos.
#
# IMPORTANT: use `--override-channels` (or run `conda config --add channels
# conda-forge` + `conda config --set channel_priority strict` once) when
# applying this file. This machine's base conda config only lists the
# `defaults` channel; mixing `defaults` with `conda-forge` on a stack this
# complex (DOLFINx/PETSc) makes the solver pathologically slow. `cpuonly` is
# a PyTorch-channel package (not on conda-forge) and is deliberately not
# listed here — conda-forge's `pytorch` build resolves to a CPU-only variant
# automatically when no CUDA virtual package is present.
name: fenicsx-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # FEM baseline (DOLFINx)
  - fenics-dolfinx
  - mpich
  - pyvista
  - petsc4py

  # PyTorch — only used here for writing/smoke-testing PINN on CPU;
  # conda-forge picks the CPU build automatically on this machine.
  - pytorch

  # Shared tooling
  - numpy
  - scipy
  - matplotlib
  - jupyterlab
  - pytest
  - black
  - ruff
